# Không được tắt mục này. bStats chỉ gửi số liệu thống kê ẩn danh của plugin.
metric: true

# false khi chạy server đơn, kể cả server đơn online-mode=false.
# true khi backend nằm sau Velocity/Bungee và proxy đã forwarding UUID/IP đúng cách.
# Giá trị này giúp PremiumAuth phân biệt proxy backend với server standalone offline-mode.
ip-forwarding: false

# Số phút một phiên quyền cao được giữ trước khi bắt buộc xác minh lại.
# Giá trị càng thấp càng an toàn nhưng admin sẽ phải đăng nhập bảo mật thường xuyên hơn.
op-verification-reset-time: 20

# Danh sách tài khoản quản trị được phép nhận Bukkit OP hoặc LuckPerms wildcard "*".
# Tên không phân biệt hoa/thường trong bước whitelist, nhưng Premium PreAuth có thể kiểm tra đúng kiểu chữ.
op-whitelist:
  - "YourName"

# Không nhập mật khẩu thô tại đây.
# Hãy tạo hoặc reset mật khẩu từ console bằng:
#   /oppass createpass <mật-khẩu>
#   /oppass resetpass [mật-khẩu]
# Plugin chỉ lưu PBKDF2 hash tại khóa này để tương thích với cấu hình cũ.
op-password: ""

# Chính sách bảo vệ mật khẩu và mã 2FA.
password-security:
  # Độ dài tối thiểu của mật khẩu do admin tự đặt.
  min-length: 10

  # Độ dài mật khẩu ngẫu nhiên khi dùng /oppass resetpass mà không nhập mật khẩu mới.
  generated-length: 24

  # Số lần nhập sai mật khẩu tối đa trong một cửa sổ kiểm tra.
  max-attempts: 5

  # Khoảng thời gian tính số lần nhập sai mật khẩu, đơn vị giây.
  attempt-window-seconds: 60

  # Thời gian khóa tạm sau khi vượt quá số lần nhập sai mật khẩu, đơn vị giây.
  lockout-seconds: 180

  # Số lần nhập sai mã 2FA tối đa trước khi bị khóa tạm.
  max-2fa-attempts: 5

  # Thời gian khóa tạm sau khi nhập sai mã 2FA quá nhiều, đơn vị giây.
  2fa-lockout-seconds: 300

# Bảo vệ nội dung mật khẩu khỏi command logger và plugin theo dõi command thông thường.
secure-command-input:
  # true = PacketEvents chặn raw command /oppass trước khi mật khẩu xuất hiện trong console log.
  hide-oppass-from-console-log: true

# Số giây tối đa để tài khoản quản trị hoàn tất toàn bộ quy trình xác minh.
pass-timeout: 60

# Hành động khi hết thời gian xác minh.
# Hỗ trợ: "ban" hoặc "kick". Giữ "ban" nếu muốn bảo mật nghiêm ngặt như bản cũ.
verification-timeout-action: "ban"

# Ẩn và chặn tab-complete của các lệnh nhạy cảm hoặc lệnh làm lộ thông tin server/plugin.
tab-complete-block:
  # Bật lớp bảo vệ tab-complete ở cả Bukkit event và PacketEvents.
  enabled: true

  # true = in thêm log phục vụ debug tab-complete; nên để false trên production.
  debug: false

  # Các command root được theo dõi để xóa gợi ý tham số từ server.
  target-commands:
    - "version"
    - "ver"
    - "about"
    - "bukkit"
    - "bukkit:version"
    - "bukkit:ver"
    - "bukkit:about"

  # Danh sách command không được phép xuất hiện trong gợi ý tab-complete.
  blocked-commands:
    - "ver"
    - "version"
    - "about"
    - "bukkit"
    - "bukkit:ver"
    - "bukkit:version"
    - "bukkit:about"
    - "minecraft:ver"
    - "minecraft:version"
    - "minecraft:about"
    - "icanhasbukkit"
    - "paper:version"
    - "folia:version"
    - "plugins"
    - "pl"
    - "plugin"
    - "server"
    - "help"
    - "?"
    - "reload"
    - "rl"
    - "stop"
    - "restart"
    - "reload-all"
    - "luckperms"
    - "lp"
    - "luckperms:lp"
    - "luckperms:user"
    - "luckperms:group"
    - "luckperms:track"
    - "essentials"
    - "ess"
    - "essentials:*"

# Những lệnh vẫn bị cấm ngay cả sau khi tài khoản quyền cao đã xác minh thành công.
# Dùng tên command không cần dấu "/"; namespace như bukkit:version vẫn được hỗ trợ.
disabled-commands:
  - "op"
  - "pl"
  - "plugins"
  - "about"
  - "bukkit"
  - "ver"
  - "version"
  - "icanhasbukkit"
  - "server"
  - "luckperms"
  - "luckperms:lp"
  - "lp"
  - "setblock"
  - "kill"
  - "/sphere"
  - "pt"
  - "powertool"
  - "ept"
  - "execute"
  - "perms"
  - "perm"
  - "permission"

# Tùy chọn chặn một số command chạy trực tiếp từ console.
console-blocked-cmd:
  # false = console vẫn dùng command bình thường.
  enabled: false

  # Danh sách command console bị chặn khi tính năng phía trên được bật.
  commands:
    - "about"
    - "stop"

# Các lệnh người chơi vẫn được dùng trong lúc đang bị khóa chờ xác minh.
# Nên chỉ cho phép lệnh đăng nhập/xác thực cần thiết.
allowed-commands:
  - "login"
  - "l"
  - "register"

# Các command bổ sung được console chạy khi tài khoản whitelist rời server.
# OPProtection vẫn tự thu hồi Bukkit OP, wildcard "*" và phiên xác minh trước khi chạy danh sách này.
logout-actions:
  - "deop %player%"
  - "lp user %player% permission unset *"
  - "gamemode survival %player%"

# Bot Discord dùng để gửi mã 2FA và các cảnh báo bảo mật.
discord:
  # Bật kết nối bot Discord.
  enabled: false

  # Token bot Discord. Không chia sẻ file config chứa token cho người khác.
  token: "YOUR_BOT_TOKEN"

  # ID kênh Discord nhận mã 2FA/cảnh báo của OPProtection.
  channel-id: "YOUR_CHANNEL_ID"

  # true = sau bước mật khẩu, admin phải nhập thêm mã 2FA gửi qua Discord.
  use-2fa: false

  # Số giây mã 2FA Discord còn hiệu lực trước khi tự hết hạn.
  two-fa-code-timeout-seconds: 60

# Giới hạn tài khoản quản trị theo quốc gia dựa trên IP công khai.
geoip:
  # Bật kiểm tra GeoIP cho người chơi đăng nhập.
  enabled: false

  # Danh sách mã quốc gia ISO-3166-1 alpha-2 được phép, ví dụ VN, US, SG.
  allowed-countries:
    - "VN"

  # Timeout tối đa cho mỗi yêu cầu GeoIP, đơn vị mili giây.
  timeout-ms: 3000

  # Thời gian cache kết quả IP để giảm số lần gọi API, đơn vị giây.
  cache-seconds: 1800

  # true = lỗi API hoặc timeout cũng chặn tài khoản bảo vệ để tránh fail-open.
  # false = cho phép đăng nhập khi dịch vụ GeoIP lỗi.
  fail-closed: true

  # Tin nhắn kick khi quốc gia không nằm trong danh sách cho phép.
  block-message: "&#FF5C5CQuốc gia của bạn không được phép truy cập server."

# Giảm spam command từ người chơi.
anti-spam:
  # Bật giới hạn tốc độ command.
  enabled: false

  # Khoảng cách tối thiểu giữa hai command, đơn vị giây.
  delay-seconds: 1

  # Tin nhắn khi người chơi gửi command quá nhanh.
  spam-message: "&#FFB84DHãy chậm lại, bạn đang gửi lệnh quá nhanh."

# Chỉ cho phép người chơi vào bằng domain và proxy chính thức.
domain-whitelist:
  # Bật kiểm tra hostname/domain trong handshake đăng nhập.
  enabled: false

  # Danh sách domain hợp lệ; domain đầu tiên được dùng trong tin nhắn hướng dẫn.
  allowed-domains:
    - "play.myserver.com"
    - "mc.yourdomain.net"

  # true = cho phép cả subdomain, ví dụ asia.play.myserver.com.
  allow-subdomains: false

  # Xác minh IP socket thật sự thuộc proxy đã tin cậy để tránh giả mạo hostname.
  strict-proxy-ip:
    # Bật whitelist IP proxy. Nên luôn bật nếu domain-whitelist đang hoạt động.
    enabled: true

    # Danh sách IP/CIDR/wildcard của proxy được phép kết nối tới backend.
    allowed-proxy-ips:
      - "127.0.0.1"
      - "::1"

    # true = chặn toàn bộ kết nối nếu danh sách allowed-proxy-ips bị để trống.
    block-when-empty: true

  # Tin nhắn riêng của lớp domain/proxy.
  messages:
    # Tin nhắn khi người chơi dùng domain không hợp lệ hoặc kết nối trực tiếp.
    kick-message: "&#FF5C5CBạn không được phép kết nối trực tiếp.\n&#FFD166Hãy sử dụng domain chính thức: &#FFFFFF%domain%"

    # Tin nhắn khi server không đọc được hostname trong phiên đăng nhập.
    no-domain-detected: "&#FF5C5CKhông xác định được domain kết nối. Hãy vào lại bằng domain chính thức."

    # Tin nhắn khi IP socket không thuộc proxy whitelist.
    proxy-blocked: "&#FF5C5CProxy hoặc IP kết nối không hợp lệ."

# Premium PreAuth độc lập dành cho các tài khoản trong op-whitelist.
# Tính năng này không hook và không yêu cầu JPremium.
# OPProtection tự tra Mojang/Minecraft Services và tự chọn cơ chế theo môi trường:
# - online-mode=true: UUID phải trùng UUID Premium chính thức.
# - backend sau proxy, ip-forwarding=true: UUID do proxy chuyển xuống phải trùng UUID Premium chính thức.
# - server đơn online-mode=false, ip-forwarding=false: chỉ kiểm tra hồ sơ Premium tồn tại; do giao thức
#   offline-mode không chứng minh quyền sở hữu tài khoản, password/console/Discord verification vẫn bắt buộc.
#   Chế độ standalone offline-mode tuyệt đối không được tự bỏ qua 2FA chỉ nhờ nickname Premium.
premium-auth:
  # Bật xác minh tài khoản Java Premium trước khi cho tài khoản quản trị tiếp tục đăng nhập.
  enabled: false

  # true = dịch vụ Mojang lỗi/timeout thì từ chối đăng nhập; khuyến nghị giữ true cho tài khoản admin.
  # false = cho phép fail-open khi API lỗi, giảm an toàn và chỉ nên dùng tạm thời để xử lý sự cố.
  fail-closed: true

  # Timeout cho mỗi request tới Mojang/Minecraft Services, đơn vị mili giây.
  mojang-timeout-ms: 3000

  # Số vòng thử lại khi API lỗi tạm thời hoặc trả về HTTP 429/5xx; giới hạn nội bộ từ 1 đến 3.
  lookup-retries: 2

  # Thời gian cache hồ sơ Premium thành công/không tồn tại, đơn vị giây.
  cache-seconds: 3600

  # true = yêu cầu tên đăng nhập khớp chính xác chữ hoa/thường với hồ sơ Mojang.
  require-exact-name-case: false

  # Nên giữ false: tài khoản Premium vẫn phải vượt qua password và 2FA như bình thường.
  # true = chỉ online-mode hoặc proxy forwarding có UUID Premium khớp mới được bỏ qua 2FA Discord.
  # Server đơn online-mode=false luôn bỏ qua setting này và vẫn bắt buộc lớp xác minh phụ.
  op-whitelist-premium-auto-bypass-2fa: false

  # Tin nhắn kick khi UUID/tài khoản Premium không hợp lệ hoặc có dấu hiệu giả mạo.
  messages:
    kick-cracked-spoof: "&#FF5C5CVui lòng đăng nhập acc premium"

# Discord-Sync yêu cầu phê duyệt một lần trước khi dùng các lệnh nhạy cảm.
discord-sync:
  # Bật lớp xác minh Discord-Sync.
  enabled: false

  # Hành động khi tài khoản chưa xác minh nhưng cố dùng command nhạy cảm.
  # Hỗ trợ theo logic hiện tại: "kick", "deop" hoặc hành động bảo mật đã cấu hình.
  unauthorized-action: "kick"

  # Số giây một phiên Discord-Sync đã duyệt còn hiệu lực.
  verification-timeout-seconds: 300

  # Số giây một yêu cầu/mã phê duyệt còn hiệu lực trước khi phải tạo lại.
  request-timeout-seconds: 120

  # Số lần nhập sai mã phê duyệt tối đa.
  max-code-attempts: 5

  # Thời gian khóa tạm sau khi nhập sai mã quá nhiều, đơn vị giây.
  code-lockout-seconds: 300

  # true = ghi các sự kiện Discord-Sync quan trọng ra console.
  log-to-console: true

  # Danh sách Discord user ID được phép phê duyệt yêu cầu.
  allowed-discord-user-ids: []

  # Danh sách Discord role ID được phép phê duyệt yêu cầu.
  # Phải có ít nhất một user ID hoặc role ID để nút phê duyệt hoạt động.
  allowed-discord-role-ids: []

  # Những command bắt buộc phải có phiên Discord-Sync hợp lệ.
  commands:
    - "/reload"
    - "/stop"
    - "/restart"
    - "/op"
    - "/deop"
    - "/ban"
    - "/kick"
    - "/save-all"

  # Tin nhắn riêng của Discord-Sync.
  messages:
    # Thông báo khi command hiện tại yêu cầu Discord-Sync.
    command-requires-sync: "&#FFB84DLệnh này yêu cầu xác minh Discord."

    # Hướng dẫn người chơi tạo yêu cầu phê duyệt.
    verify-required: "&#FFD166Hãy dùng /verify và chờ quản trị viên Discord phê duyệt."

    # Thông báo khi quyền cao bị thu hồi do chưa xác minh.
    deop-message: "&#FF5C5CQuyền cao đã bị thu hồi vì chưa xác minh Discord."

    # Thông báo khi server dừng do hành vi bảo mật nghiêm trọng.
    shutdown-message: "&#FF5C5CServer đang dừng do phát hiện hành vi bảo mật nghiêm trọng."

    # Tin nhắn kick do thiếu xác minh Discord.
    kick-message: "&#FF5C5CBạn chưa xác minh Discord cho thao tác nhạy cảm này."

# Theo dõi SHA-256 của toàn bộ file JAR trong thư mục plugins.
# Tính năng chỉ cảnh báo thay đổi; không tự xóa hoặc tự disable plugin để tránh false positive.
integrity-check:
  # Bật giám sát plugin JAR theo baseline SHA-256.
  enabled: true

  # Chu kỳ quét lại thư mục plugins, đơn vị phút; giá trị nhỏ hơn 5 sẽ tự nâng lên 5.
  interval-minutes: 30

# Nhật ký sự kiện bảo mật dạng append-only và tự xoay vòng.
audit-log:
  # Dung lượng tối đa của file audit hiện tại trước khi rotate, đơn vị MB.
  max-size-mb: 20

  # Số file audit cũ được giữ lại sau khi rotate.
  retained-files: 5

# Thay đổi brand gửi tới F3 để hạn chế lộ phần mềm server/backend thật.
f3-brand-spoof:
  # Bật chặn và thay thế packet minecraft:brand.
  enabled: true

  # Brand giả hiển thị cho client trong F3.
  fake-brand: "&bOP&fProtection"

  # true = in log packet brand phục vụ debug; nên để false trên production.
  debug: false
