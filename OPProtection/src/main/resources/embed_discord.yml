request:
  title: "🔐 OPProtection • Yêu cầu xác minh"
  color: 4379892
  fields:
    - name: "Người chơi"
      value: "`%player%`"
      inline: true
    - name: "Địa chỉ IP"
      value: "`%ip%`"
      inline: true
    - name: "Trạng thái"
      value: "Đang chờ xác minh"
      inline: false
  footer: "OPProtection Security"

verified:
  title: "✅ OPProtection • Xác minh thành công"
  color: 7268264
  fields:
    - name: "Người chơi"
      value: "`%player%`"
      inline: true
    - name: "Địa chỉ IP"
      value: "`%ip%`"
      inline: true
    - name: "Trạng thái"
      value: "Phiên quyền cao đã được mở khóa"
      inline: false
  footer: "OPProtection Security"

2fa-code:
  title: "🔑 OPProtection • Mã 2FA một lần"
  color: 4379892
  fields:
    - name: "Người chơi"
      value: "`%player%`"
      inline: true
    - name: "Mã xác minh"
      value: "||`%code%`||"
      inline: false
    - name: "Lưu ý"
      value: "Không chia sẻ mã. Mã tự hết hạn theo cấu hình."
      inline: false
  footer: "Chỉ quản trị viên được phép xem mã này"

suspicious:
  title: "🚨 OPProtection • Cảnh báo đăng nhập"
  color: 16735324
  fields:
    - name: "Người chơi"
      value: "`%player%`"
      inline: true
    - name: "Địa chỉ IP"
      value: "`%ip%`"
      inline: true
    - name: "Trạng thái"
      value: "Phát hiện tín hiệu đăng nhập bất thường"
      inline: false

spoof-alert:
  title: "🚨 OPProtection • Spoof bị chặn"
  color: 16735324
  fields:
    - name: "Người chơi"
      value: "`%player%`"
      inline: true
    - name: "Socket IP"
      value: "`%socketIp%`"
      inline: true
    - name: "Forwarded IP"
      value: "`%spoofedIp%`"
      inline: true
    - name: "Forwarded UUID"
      value: "`%spoofedUuid%`"
      inline: false
    - name: "Lý do"
      value: "%reason%"
      inline: false

# Cảnh báo khi chạy lệnh nhạy cảm mà chưa verify Discord.
discord-sync-alert:
  title: "🚨 OPProtection • Lệnh nhạy cảm bị chặn"
  color: 16735324
  fields:
    - name: "Người chơi"
      value: "`%player%`"
      inline: true
    - name: "Lệnh"
      value: "`/%command%`"
      inline: true
    - name: "Hành động"
      value: "`%action%`"
      inline: true
  footer: "OPProtection Discord-Sync"

discord-sync-verified:
  title: "✅ OPProtection • Discord-Sync hợp lệ"
  color: 7268264
  fields:
    - name: "Minecraft"
      value: "`%player%`"
      inline: true
    - name: "Discord"
      value: "`%discordUser%`"
      inline: true
    - name: "Hiệu lực"
      value: "%timeout% phút"
      inline: false
  footer: "OPProtection Discord-Sync"

discord-sync-request:
  title: "🔐 OPProtection • Yêu cầu phê duyệt"
  color: 4379892
  fields:
    - name: "Người chơi"
      value: "`%player%`"
      inline: true
    - name: "UUID"
      value: "`%uuid%`"
      inline: false
    - name: "Địa chỉ IP"
      value: "`%ip%`"
      inline: true
    - name: "Thời gian"
      value: "`%timestamp%`"
      inline: true
    - name: "Mã một lần"
      value: "||`%code%`||"
      inline: false
    - name: "Cách phê duyệt"
      value: "Console/admin khác: `/opverify %player% %code%`\nHoặc nhấn nút bên dưới."
      inline: false
  footer: "Yêu cầu hết hạn sau %timeout% phút • ID %request_id%"
