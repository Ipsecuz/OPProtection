# Forwarding / proxy mode. Bật true khi backend chạy sau Velocity/Bungee forwarding.
ip-forwarding: false

# Thời gian yêu cầu xác minh lại OP, tính bằng phút.
op-verification-reset-time: 20

# Danh sách tài khoản được phép dùng quy trình OPProtection.
op-whitelist:
  - YourName

# Không nhập mật khẩu thô tại đây. Dùng console:
#   oppass createpass <mật-khẩu>
#   oppass resetpass
# Giá trị bên dưới sẽ là PBKDF2 hash sau khi tạo/reset.
op-password: ""

password-security:
  min-length: 8
  generated-length: 24

secure-command-input:
  # Chặn packet /oppass trước khi Paper/Spigot ghi raw command ra console log.
  hide-oppass-from-console-log: true

pass-timeout: 60

tab-complete-block:
  enabled: true
  debug: false
  blocked-commands:
    - "ver"
    - "version"
    - "about"
    - "bukkit"
    - "bukkit:ver"
    - "bukkit:version"
    - "bukkit:about"
    - "minecraft:ver"
    - "minecraft:version"
    - "minecraft:about"
    - "icanhasbukkit"
    - "paper:version"
    - "folia:version"
    - "plugins"
    - "pl"
    - "plugin"
    - "server"
    - "help"
    - "?"
    - "reload"
    - "rl"
    - "stop"
    - "restart"
    - "reload-all"
    - "luckperms"
    - "lp"
    - "luckperms:lp"
    - "luckperms:user"
    - "luckperms:group"
    - "luckperms:track"
    - "essentials"
    - "ess"
    - "essentials:*"

# Danh sách lệnh bị chặn cho OP đã đăng nhập nhằm giảm rủi ro thao tác nguy hiểm.
disabled-commands:
  - op
  - pl
  - plugins
  - about
  - bukkit
  - ver
  - version
  - icanhasbukkit
  - server
  - luckperms
  - luckperms:lp
  - lp
  - setblock
  - kill
  - /sphere
  - pt
  - powertool
  - ept
  - execute
  - perms
  - perm
  - permission

# Chặn riêng một số lệnh từ console nếu cần.
console-blocked-cmd:
  enabled: false
  commands:
    - "about"
    - "stop"

# Lệnh được phép dùng khi chưa xác minh OP
# Khi xác minh OP thành công → được phép chat + sài tất cả lệnh (trừ disabled-commands)
# Khi chưa xác minh OP → chỉ được sài lệnh trong danh sách này + /oppass
allowed-commands:
  - login
  - l
  - register

# Hành động khi tài khoản OP whitelist thoát server.
logout-actions:
  - "deop %player%"
  - "lp user %player% permission unset *"
  - "gamemode survival %player%"

# Discord bot cho 2FA. Sau khi bật, hãy restart server để module khởi tạo sạch.
discord:
  enabled: false
  token: "YOUR_BOT_TOKEN"
  channel-id: "YOUR_CHANNEL_ID"
  use-2fa: false
  # Thời gian code hết hạn (tính bằng giây) - sau thời gian này thì mã không dùng được nữa
  two-fa-code-timeout-seconds: 60  # 60 giây = 1 phút

# Anti VPN
geoip:
  enabled: false
  allowed-countries:
    - "VN"  # Việt Nam
  block-message: "&cQuốc gia của bạn không được phép truy cập server!"

# Giảm spam command
anti-spam:
  enabled: false
  # Thời gian tối thiểu giữa 2 lệnh (giây)
  delay-seconds: 1
  # Thông báo khi bị chặn
  spam-message: "&cHãy chậm lại! Bạn đang spam lệnh quá nhanh."

# Người chơi phải vào qua các domain trong danh sách này mới được accept
domain-whitelist:
  enabled: false
  # Chỉ accept hostname trùng chính xác các domain dưới đây. Không dùng startsWith để tránh play.myserver.com.evil.
  allowed-domains:
    - "play.myserver.com"
    - "mc.yourdomain.net"
  # Nếu bật thì subdomain như survival.play.myserver.com cũng được phép. Mặc định false để chặt nhất.
  allow-subdomains: false
  # Lưu ý: nếu Velocity và backend cùng máy, ví dụ: allowed-proxy-ips thường là 127.0.0.1. Khi đó plugin không thể phân biệt
  # process Velocity thật với một process/proxy giả cũng chạy local; hãy dùng firewall/iptables để khóa backend port.
  strict-proxy-ip:
    enabled: true
    # Thêm IP proxy thật vào đây. Hỗ trợ exact IP, IP:port, CIDR, wildcard IPv4 như 10.0.0.*
    # Ví dụ proxy ở VPS khác: "xxx.xxx.xxx.xxx" hoặc lỡ ghi "xxx.xxx.xxx.xxx:25565" plugin cũng tự bỏ port.
    # Nếu proxy Velocity ở cùng máy thì thêm "127.0.0.1" và đảm bảo firewall chặn bên ngoài vào backend port.
    allowed-proxy-ips:
      - "127.0.0.1"
      - "::1"
    # true = nếu quên cấu hình allowed-proxy-ips thì chặn hết để fail-closed.
    block-when-empty: true
  messages:
    kick-message: "&cBạn không được phép kết nối trực tiếp vào server này!\n&eVui lòng sử dụng domain chính thống: &f%domain%"
    no-domain-detected: "&cKhông thể xác định domain kết nối. Vui lòng kết nối lại qua domain chính thức."
    proxy-blocked: "&cProxy/IP kết nối không hợp lệ. Vui lòng vào server qua proxy chính thức."

# Premium Auth cho người trong op-whitelist - kiểm tra nickname có premium Mojang và UUID join phải khớp UUID chính thức.
# Dùng để chặn acc crack/offline UUID giả danh tên premium trong op-whitelist.
premium-auth:
  enabled: false
  # true = nếu Mojang API lỗi/timeout thì chặn OP-whitelist để an toàn.
  fail-closed: true
  mojang-timeout-ms: 3000
  cache-seconds: 3600
  require-exact-name-case: false
  # false = acc premium vẫn phải xác minh /oppass + 2FA như cũ.
  # true = nếu premium UUID match thì tự bypass bước 2FA OPProtection cho người trong op-whitelist.
  # Khuyến nghị giữ false để OP vẫn cần xác minh 2FA.
  op-whitelist-premium-auto-bypass-2fa: false 
  messages:
    # Không dùng %reason% ở đây để tránh lộ UUID/internal reason ra disconnect log.
    kick-cracked-spoof: "&cBạn không phải là tài khoản premium, vui lòng đăng nhập bằng premium"

# Discord Sync - Yêu cầu xác minh Discord cho các command trong whitelist
discord-sync:
  enabled: false  # Bật/tắt toàn bộ module
  # Hành động khi player không được verify chạy command yêu cầu sync
  # Options: kick, deop, shutdown, stop
  unauthorized-action: "kick"  # Đóng server nếu hacker cố gắng
  # Timeout xác minh cũng sẽ là time sử dụng lệnh và hết time cần verify lại(tính bằng giây)
  verification-timeout-seconds: 300  # 5 phút
  # Log broadcast khi player verify thành công
  log-to-console: true
  # Danh sách command yêu cầu Discord sync - Thêm lệnh vào để bắt buộc xác minh Discord
  commands:
    - /reload
    - /stop
    - /restart
    - /op
    - /deop
    - /ban
    - /kick
    - /save-all
  # Các message liên quan đến xác minh Discord
  messages:
    # Warning message khi player cố gắng sử dụng command yêu cầu Discord sync
    command-requires-sync: "&cLệnh này yêu cầu xác minh Discord!"
    # Message yêu cầu verify
    verify-required: "&eVui lòng xác minh qua Discord trước khi sử dụng lệnh này."
    # Message khi action là deop
    deop-message: "&cQuyền OP đã bị gỡ do lỗi xác minh bảo mật!"
    # Message khi action là shutdown/stop
    shutdown-message: "&c Server đang đóng vì phát hiện nghi vấn bảo mật..."
    # Message khi action là kick
    kick-message: "&c[Discord-Sync] Bạn đã bị kick vì cố gắng sử dụng lệnh bảo mật mà chưa xác minh Discord!"

f3-brand-spoof:
  enabled: true             #F3 ở trong server là thấy
  fake-brand: "&6OPPROT&aECTION"
  debug: false        