request:
  title: "🔐 Xác minh OP"
  color: 16776960
  fields:
    - name: "🧍 Người chơi"
      value: "%player%"
    - name: "🌐 IP"
      value: "%ip%"
    - name: "✅ Trạng thái"
      value: "Yêu cầu"

verified:
  title: "✅ Xác minh thành công"
  color: 65280
  fields:
    - name: "🧍 Người chơi"
      value: "%player%"
    - name: "🌐 IP"
      value: "%ip%"
    - name: "✅ Trạng thái"
      value: "Đã xác minh thành công"
  footer: "Đã xác minh bởi hệ thống"

2fa-code:
  title: "🔐 Mã xác thực 2FA"
  color: 5814783
  fields:
    - name: "🧍 Người chơi"
      value: "%player%"
    - name: "🔑 Mã xác thực"
      value: "``%code%``"
    - name: "⚠ Lưu ý"
      value: "Mã có hiệu lực trong 5 phút!"
  footer: "Chỉ quản trị viên mới được xác minh"

suspicious:
  title: "❌ Cảnh báo đăng nhập"
  color: 16711680
  fields:
    - name: "🧍 Người chơi"
      value: "%player%"
    - name: "🌐 IP"
      value: "%ip%"
    - name: "❌ Trạng thái"
      value: "Nghi vấn"

spoof-alert:
  title: "🚨 IP/UUID Spoof Detected"
  color: 16711680
  fields:
    - name: "🧍 Người chơi"
      value: "%player%"
    - name: "🔌 Socket IP"
      value: "%socketIp%"
    - name: "📡 Spoofed IP"
      value: "%spoofedIp%"
    - name: "🆔 Spoofed UUID"
      value: "%spoofedUuid%"
    - name: "⚠ Lý do"
      value: "%reason%"

discord-sync-alert:
  title: "🚨 Discord-Sync Alert"
  color: 16711680
  fields:
    - name: "🧍 Người chơi"
      value: "%player%"
    - name: "⚠ Lệnh"
      value: "/%command%"
    - name: "❌ Trạng thái"
      value: "Not verified on Discord"
    - name: "🔨 Hành động"
      value: "%action%"
  footer: "Phát hiện cố gắng sử dụng lệnh bảo mật mà chưa xác minh Discord"

discord-sync-verified:
  title: "✅ Xác minh Discord thành công!"
  color: 65280
  fields:
    - name: "🧍 Người chơi Minecraft"
      value: "%player%"
    - name: "👤 Discord User"
      value: "%discordUser%"
    - name: "⏱️ Thời hạn"
      value: "%timeout% phút"
  footer: "Xác minh thành công - Người chơi có thể sử dụng lệnh bảo mật"

discord-sync-request:
  title: "🔐 Yêu cầu xác minh Minecraft"
  color: 16776960
  fields:
    - name: "🧍 Người chơi"
      value: "%player%"
    - name: "🆔 UUID"
      value: "%uuid%"
    - name: "🌐 IP"
      value: "%ip%"
    - name: "⏰ Thời gian"
      value: "%timestamp%"
    - name: "🔑 Mã xác minh"
      value: "``%code%``"
    - name: "📋 Hướng dẫn"
      value: "1. Admin xác minh: `/opverify %code%`\n2. Hoặc nhấn nút dưới đây"
  footer: "Hết hạn sau: %timeout% phút"
